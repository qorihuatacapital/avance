.hoy b{color:#7a5a12}.hoy .malo{color:#c62828;font-weight:700}.st.atr{box-shadow:inset 4px 0 0 #c62828}.st.atr em:after{content:" · atrasado";color:#c62828;font-style:normal;font-weight:700;font-size:12px}

.cel.s8{font-size:11px;padding:8px 2px;min-width:74px}.cel.s8.v0{background:#f1eff8;color:#7d7a99}.cel.s8.v50{background:#fdf0d5;color:#8a5a00}
.todas8{display:block;margin:4px auto 0;padding:3px 7px;border:1px solid #b8862a;border-radius:6px;background:#fffaf0;color:#7a5a12;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer}

td.tdm{min-width:118px;vertical-align:top;padding-top:6px}select.smes{width:100%;padding:6px 4px;border-radius:6px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--ln)}
select.smes.sok{background:#2e7d32;color:#fff;border-color:#2e7d32}select.smes.satr{background:#fdf0d5;color:#8a5a00;border-color:#e6c27a}select.smes.svacio{background:#f1eff8;color:#7d7a99}
select.smes.sna{background:#fff;color:#9a97b3;border-style:dashed}select.smes.venc8{box-shadow:0 0 0 2px #c62828}small.atrm{display:block;font-size:10.5px;color:#b26a00;font-weight:700;margin-top:2px}small.okm{display:block;font-size:10.5px;color:#2e7d32;font-weight:700;margin-top:2px}

.s8card input[type=range],.s8card .opt,.s8card>span,.s8card .nal{display:none}.kbox{display:flex;flex-direction:column;gap:8px;margin-top:6px}.kbox label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:3px}
</style></head><body>
<header><h1>Avance del mes · Qorihuata</h1><p>1) Elige tu nombre. 2) Confirma tus empresas. 3) Registra tu avance con las barras.</p></header>
<main>
<div class="box" style="display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end"><div><p class="lbl">¿Quién eres?</p><div class="who" id="who"></div></div><div><p class="lbl">Mes que reportas</p><select id="mes"></select><p class="note" id="hoy" style="margin-top:6px"></p></div></div>
<p class="note" id="hint">Toca tu nombre para empezar.</p>
<div id="list"></div>
</main>
<script>
var FORM="https://docs.google.com/forms/d/e/1FAIpQLSfbtvi94Aehywh2SK3_qTuwgvULFTQbDbGrmcueqXEfesNTGA/formResponse";
// ---- Cobranza de facturas del servicio contable: formulario PRIVADO aparte (no se publica), no afecta el % de avance
var FORM_COB="https://docs.google.com/forms/d/e/1FAIpQLSfhm7-JJsPopd47j4C_m0N4fqn1dL9cs2XcHT-gMdbARSDNkQ/formResponse";
var C_WHO="entry.1911344112",C_EMP="entry.985908557",C_PER="entry.336774317",C_HON="entry.1523527826",C_EST="entry.1097130401",
C_MON="entry.2085742585",C_FEC="entry.1370738613",C_MED="entry.880099782",C_CPE="entry.111373337",C_NOT="entry.1020459106";
var HONORARIOS={}; // monto fijo de la factura por empresa (lo carga Jabes); si no está, la contadora lo escribe y se recuerda
var MEDIOS=["Transferencia","Yape / Plin","Efectivo","Depósito"],ESTADOS=["Pendiente","Parcial","Cobrado"];
function cobKey(emp){return "cob:"+MES_SEL+":"+who+":"+emp}
function cobHtml(c,i){var k=load(cobKey(c.emp))||{};var hon=HONORARIOS[c.emp]||k.hon||load("hon:"+who+":"+c.emp)||"";
var est=k.est||"",med=k.med||"";
return '<div class="cob fila" data-emp="'+esc(c.emp)+'" data-i="'+i+'" data-cst="'+esc(k.cst||"")+'"><h4><span class="dot '+est+'" id="cd'+i+'"></span>'+esc(c.emp)+'</h4>'
+'<div class="row"><label>Monto factura S/</label><input type="number" min="0" step="0.01" class="mon hon" value="'+esc(hon)+'"'+(HONORARIOS[c.emp]?' readonly title="Monto fijo cargado por Jabes"':'')+' placeholder="0.00">'
+'<label>Estado</label><div class="cbo est">'+ESTADOS.map(function(x){return '<button type="button" data-x="'+x+'"'+(x===est?' class="on"':'')+'>'+(x==="Parcial"?"Cobrado parcial":x)+'</button>'}).join('')+'</div></div>'
+'<div class="row cpart"'+(est==="Parcial"?'':' style="display:none"')+'><label>Monto cobrado S/</label><input type="number" min="0" step="0.01" class="mon cmon" value="'+esc(k.mon||"")+'" placeholder="0.00"></div>'
+'<div class="row cpag"'+(est&&est!=="Pendiente"?'':' style="display:none"')+'><label>Fecha de cobro</label><input type="date" class="cfec" value="'+esc(k.fec||"")+'">'
+'<label>Medio</label><div class="cbo med">'+MEDIOS.map(function(x){return '<button type="button" data-x="'+x+'"'+(x===med?' class="on"':'')+'>'+x+'</button>'}).join('')+'</div><input type="text" class="ccpe" value="'+esc(k.cpe||"")+'" placeholder="N° factura (opcional)" style="width:180px">'+constHtml(k)+'</div>'
+'<div class="row"><input type="text" class="cnota" value="'+esc(k.nota||"")+'" placeholder="Nota (opcional): ej. paga a fin de mes"><span class="cmsg">'+(k.t?"Registrado "+esc(k.t):"Sin registrar")+'</span></div></div>';}
function cobResumen(){var n={Cobrado:0,Parcial:0,Pendiente:0,no:0},cob=0,hon=0;ITEMS.forEach(function(c){var k=load(cobKey(c.emp));if(k&&k.est){n[k.est]++;cob+=Number(k.mon||0);hon+=Number(k.hon||0)}else n.no++});
return '<b>Cobrado:</b> '+n.Cobrado+' · <b>Parcial:</b> '+n.Parcial+' · <b>Pendiente:</b> '+n.Pendiente+' · <b>Sin registrar:</b> '+n.no+(hon?' · <b>S/ '+cob.toFixed(2)+'</b> de S/ '+hon.toFixed(2):'')}
function cobPanel(items){return '<div class="box"><p style="margin:0 0 6px;font-weight:700">💰 Cobranza de facturas del servicio contable de '+esc(MESANT)+'</p><p class="sub" style="margin:0 0 8px;font-size:12.5px;color:var(--mu)">Aparte del avance: no cambia tu %. Marca si cada cliente ya pagó los servicios contables del mes.</p><div class="cobres" id="cobres">'+cobResumen()+'</div></div>'
+(PL?cobTabla(items):items.map(function(c,i){return cobHtml(c,i)}).join(""))
+'<div class="cobfoot"><button type="button" class="btn" id="cobsave">Guardar cobranza</button><span class="cmsg" id="cobmsg"></span></div>'}
function cobBadge(emp){var k=load(cobKey(emp));return k&&k.est?'<span class="cbadge '+k.est+'">'+(k.est==="Cobrado"?"Cobrado":k.est==="Parcial"?"Cobro parcial":"Cobro pendiente")+'</span>':''}
var E_WHO="entry.444919183", E_EMP="entry.964281956", E_NOTA="entry.312012141";
var STEPS=[
["entry.1746248518","Cálculo de planillas","28–30 y 1–2","--s1"],
["entry.1695383682","Estados de cuenta del mes anterior","1–3","--s2"],
["entry.1647268038","Detracciones de compras y ventas","3–4","--s3"],
["entry.1120043919","PDT 601 – PLAME","3–8","--s4"],
["entry.1451663362","Registro de compras y ventas","5–9","--s5"],
