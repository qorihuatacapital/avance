<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}

summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}

input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(to right,var(--c) var(--p),var(--soft) var(--p))}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--c);margin-top:-8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--c)}

.btn.g{background:var(--soft);color:var(--fg)}
.btn.no{background:var(--sf);color:var(--bad);border:1.5px solid var(--bad)}

.st b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st b em{font-style:normal}
.nal{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap;cursor:pointer;padding:3px 8px;border:1.5px solid var(--ln);border-radius:999px;background:var(--sf)}

.st.na b em{text-decoration:line-through;opacity:.5}
.st.na .nal{border-color:var(--bad);color:var(--bad);background:#fdecec}
.st.na input[type=range],.st.na .bk,.st.na .opt{display:none}
.st input[type=range]{pointer-events:none}
.opt{grid-column:1/-1;display:flex;gap:6px;margin-top:2px}
.opt button{flex:1;font:inherit;font-size:13px;font-weight:700;padding:8px 0;border:1.5px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--fg);cursor:pointer}
.opt button.on{background:var(--c);border-color:var(--c);color:#fff}
.st.na span{color:var(--mu);font-size:12px}
</style></head><body>

["entry.1746248518","Cálculo de planillas","28–30 y 1–2","--s1"],
["entry.1695383682","Estados de cuenta del mes anterior","1–3","--s2"],

["entry.1451663362","Registro de compras y ventas","5–9","--s5"],

["entry.577253973","Conciliaciones bancarias y provisiones","16–27","--s8"]];
var EMP={

var who=null, wiz=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

$("#who").onclick=function(e){var b=e.target.closest("button");if(b)pick(b.dataset.n)};

function pick(n){
who=n;save("who",n);avisoEECC(n);
document.querySelectorAll("#who button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.n===n)});
var conf=load("conf:"+n);
if(conf)showAvance(conf);else startWizard();}

function startWizard(){var c=load("conf:"+who);var pre=c?c.si.slice():EMP[who].filter(function(e){return REMEMP[who+"|"+e]});wiz={si:pre,extra:c?c.extra.slice():[]};renderWizard();}
function renderWizard(){
var list=EMP[who].concat(wiz.extra.filter(function(e){return EMP[who].indexOf(e)<0}));
var n=wiz.si.length;
$("#hint").textContent="Paso 2 de 3: marca todas las empresas que llevas y luego toca Confirmar.";
var rows=list.map(function(e){var on=wiz.si.indexOf(e)>=0;return '<label class="re'+(on?' on':'')+'"><input type="checkbox" data-emp="'+esc(e)+'"'+(on?' checked':'')+'><span>'+esc(e)+'</span><b>'+(on?'Sí la llevo':'')+'</b></label>'}).join("");
$("#list").innerHTML='<div class="box" style="padding:0;overflow:hidden"><div class="rehead"><span class="lbl" style="margin:0">'+esc(who)+', tus empresas ('+list.length+')</span><button type="button" class="btn link" data-yn="all">Marcar todas</button></div>'+
(rows||'<p class="note" style="padding:14px">No tienes empresas asignadas. Agrega las tuyas abajo.</p>')+

function showAvance(conf){
var items=conf.si.map(function(e){return EMP[who].indexOf(e)>=0?{emp:e,label:who+" · "+e}:{emp:e,label:OTRA,extra:true}});
$("#hint").textContent=items.length?("Paso 3 de 3: hola "+who+", registra tu avance. Abre cada empresa, mueve las barras y toca Guardar. Si un paso no corresponde a la empresa (sin planilla, sin banco, etc.), marca «No aplica» y no contará en el %."):("No confirmaste empresas. Toca Cambiar mis empresas para agregarlas.");
$("#list").innerHTML='<div class="box" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="note">Llevas '+items.length+' empresa'+(items.length===1?'':'s')+'.</span><button type="button" class="btn link" data-yn="edit">Cambiar mis empresas</button></div>'+items.map(card).join("");}
function card(c,i){
var key="v:"+MES_SEL+":"+who+":"+c.emp;
var st=load(key);var na=load("na:"+who+":"+c.emp);
var rm=REM[MES_SEL+"|"+who+"|"+c.emp];if(rm&&(!st||!st.ts||rm.ts>st.ts)){st={p:rm.p.slice(),nota:rm.nota,t:rm.t,b:rm.b};na=rm.na.slice();}
st=st||{p:STEPS.map(function(){return 0}),nota:"",t:""};na=na||STEPS.map(function(){return false});
var avg=avgOf(st.p,na);
var h='<details data-i="'+i+'" data-label="'+esc(c.label)+'" data-emp="'+esc(c.emp)+'" data-extra="'+(c.extra?1:0)+'"><summary><span class="nm">'+esc(c.emp)+'</span><span class="pc" id="pc'+i+'">'+avg+'%</span>';

STEPS.forEach(function(s,j){var v=st.p[j],n=!!na[j];
h+='<div class="st'+(n?" na":(v>=100?" done":""))+'" style="--c:var('+s[3]+')"><b><em>'+(j+1)+'. '+s[1]+' <small>· días '+s[2]+'</small></em><label class="nal"><input type="checkbox" class="nachk"'+(n?' checked':'')+'>No aplica</label></b>';
h+='<input type="range" min="0" max="100" step="25" value="'+v+'" style="--p:'+v+'%" aria-label="'+esc(s[1])+'"'+(n?' disabled':'')+'><span>'+(n?'N/A':v+'%')+'</span><div class="opt">'+[0,25,50,75,100].map(function(o){return '<button type="button" data-v="'+o+'"'+(o==v?' class="on"':'')+'>'+o+'%</button>'}).join('')+'</div>'+(j===1?banksHtml(st.b||[]):'')+'</div>';});
h+='<div class="foot"><input type="text" class="nota" value="'+esc(st.nota)+'" placeholder="Nota: qué falta (opcional)">';
h+='<button type="button" class="btn g all">Todo al 100%</button><button type="button" class="btn sv">Guardar</button><span class="msg"></span></div></div></details>';
return h;}
function vals(d){return Array.prototype.map.call(d.querySelectorAll("input[type=range]"),function(r){return Number(r.value)})}

function refresh(d){var i=d.dataset.i,a=avgOf(vals(d),nas(d));$("#pc"+i).textContent=a+"%";$("#b"+i).style.width=a+"%"}

$("#list").addEventListener("input",function(e){var r=e.target;if(r.type!=="range")return;r.style.setProperty("--p",r.value+"%");r.nextElementSibling.textContent=r.value+"%";r.parentElement.classList.toggle("done",r.value>=100);r.parentElement.querySelectorAll(".opt button").forEach(function(x){x.classList.toggle("on",x.dataset.v==r.value)});var d=r.closest("details");refresh(d);d.querySelector(".msg").textContent="Sin guardar"});
function soloCirculo(e){var r=e.target;if(r.type!=="range")return;var b=r.getBoundingClientRect(),x=e.touches?e.touches[0].clientX:e.clientX,cx=b.left+13+(b.width-26)*Number(r.value)/100;if(Math.abs(x-cx)>26)e.preventDefault()}

document.addEventListener("pointerup",function(){var a=document.activeElement;if(a&&a.type==="range")a.blur()});
$("#list").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="extra"){e.preventDefault();addExtra()}});

if(c.classList.contains("nachk")){var row=c.closest(".st"),r=row.querySelector("input[type=range]"),dd=c.closest("details");row.classList.toggle("na",c.checked);r.disabled=c.checked;row.classList.toggle("done",!c.checked&&r.value>=100);r.nextElementSibling.textContent=c.checked?"N/A":r.value+"%";save("na:"+who+":"+dd.dataset.emp,nas(dd));refresh(dd);dd.querySelector(".msg").textContent="Sin guardar";return;}

if(yn){var a=yn.dataset.yn;

var d=e.target.closest("details");if(!d)return;
if(e.target.classList.contains("all")){d.querySelectorAll("input[type=range]:not(:disabled)").forEach(function(r){r.value=100;r.dispatchEvent(new Event("input",{bubbles:true}))});return}
if(!e.target.classList.contains("sv"))return;
var b=e.target,m=d.querySelector(".msg"),p=vals(d),na=nas(d),nota=d.querySelector(".nota").value.trim(),label=d.dataset.label,emp=d.dataset.emp;
